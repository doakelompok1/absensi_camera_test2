<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Karyawan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px 14px;
      color: #172033;
    }

    .container {
      max-width: 460px;
      margin: auto;
    }

    .header {
      background: #1746a2;
      color: white;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      opacity: .9;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000a;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 10px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: none;
      color: white;
      background: #1746a2;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .secondary {
      background: #475569;
    }

    .success {
      background: #15803d;
    }

    .warning {
      background: #b45309;
    }

    video {
      width: 100%;
      background: #111827;
      border-radius: 12px;
      margin-top: 12px;
      transform: scaleX(-1);
    }

    #selfiePreview {
      width: 100%;
      border-radius: 12px;
      margin-top: 12px;
      display: block;
    }

    canvas {
      width: 100%;
      border-radius: 12px;
    }

    .hidden {
      display: none !important;
    }

    #status,
    #gpsStatus,
    #faceStatus {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .success-text {
      color: #15803d;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Absensi Karyawan</h2>
    <p>Silakan lakukan absensi harian.</p>
  </div>

  <!-- IDENTITAS -->
  <div class="card">
    <h3>1. Identitas Karyawan</h3>

    <label for="nik">Nomor Induk Karyawan (NIK)</label>

    <input
      id="nik"
      type="text"
      placeholder="Masukkan NIK"
      autocomplete="off"
    >

    <button id="checkBtn" onclick="checkEmployee()">
      Cek Karyawan
    </button>

    <div id="employee" class="hidden">
      <hr>

      <p class="name" id="empName"></p>

      <p id="empDivision"></p>

      <p class="muted" id="empStatus"></p>
    </div>
  </div>


  <!-- SELFIE -->
  <div class="card">
    <h3>2. Ambil Selfie</h3>

    <video
      id="cam"
      autoplay
      muted
      playsinline
    ></video>

    <button
      id="startBtn"
      onclick="startCamera()"
    >
      Aktifkan Kamera
    </button>

    <button
      class="success"
      id="captureBtn"
      onclick="captureSelfie()"
      disabled
    >
      Ambil Selfie
    </button>

    <button
      class="secondary"
      onclick="stopCamera()"
    >
      Matikan Kamera
    </button>

    <p id="faceStatus">
      Kamera belum aktif.
    </p>

    <img
      id="selfiePreview"
      class="hidden"
      alt="Preview selfie"
    >

    <button
      id="retakeBtn"
      class="secondary hidden"
      onclick="retakeSelfie()"
    >
      Ambil Ulang Selfie
    </button>

    <canvas
      id="photoCanvas"
      class="hidden"
    ></canvas>

    <p class="muted">
      Selfie hanya digunakan sebagai bukti foto absensi.
      Tidak ada verifikasi atau pengenalan wajah.
    </p>
  </div>


  <!-- GPS -->
  <div class="card">
    <h3>3. Lokasi</h3>

    <button
      class="secondary"
      onclick="getGPS()"
    >
      Ambil Lokasi GPS
    </button>

    <p id="gpsStatus">
      Lokasi belum diambil.
    </p>
  </div>


  <!-- ABSENSI -->
  <div class="card">
    <h3>4. Kirim Absensi</h3>

    <button
      class="success"
      id="inBtn"
      disabled
      onclick="submitAttendance('masuk')"
    >
      Absen Masuk
    </button>

    <button
      class="warning"
      id="outBtn"
      disabled
      onclick="submitAttendance('pulang')"
    >
      Absen Pulang
    </button>

    <p id="status">
      Masukkan NIK untuk memulai.
    </p>
  </div>

</div>


<script>

  // =====================================================
  // URL WEB APP APPS SCRIPT
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxqbQvtWoEasmnb_yD6TluN2YoRLe_UArsH3gAe5wEQ4JDqaawwJ01kxtYdcikgKx55/exec";


  // =====================================================
  // VARIABLE
  // =====================================================

  let employee = null;

  let stream = null;

  let locationData = null;

  let photoData = null;


  // =====================================================
  // STATUS
  // =====================================================

  function setStatus(message) {
    document.getElementById("status").textContent = message;
  }


  // =====================================================
  // CEK KARYAWAN
  // =====================================================

  async function checkEmployee() {

    const nik =
      document.getElementById("nik").value.trim();

    const btn =
      document.getElementById("checkBtn");


    if (!nik) {

      setStatus(
        "Masukkan NIK terlebih dahulu."
      );

      return;
    }


    if (API_URL.includes("TEMPEL_URL")) {

      setStatus(
        "URL Apps Script belum dipasang."
      );

      return;
    }


    btn.disabled = true;

    employee = null;

    photoData = null;

    document
      .getElementById("employee")
      .classList.add("hidden");

    document
      .getElementById("selfiePreview")
      .classList.add("hidden");

    document
      .getElementById("retakeBtn")
      .classList.add("hidden");

    updateButtons();

    setStatus(
      "Memeriksa data karyawan..."
    );


    try {

      const url =
        API_URL +
        "?action=getEmployee&nik=" +
        encodeURIComponent(nik);


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );
      }


      const result =
        await response.json();


      if (!result.success || !result.data) {

        setStatus(
          result.message ||
          "Data karyawan tidak ditemukan."
        );

        return;
      }


      employee = result.data;


      document.getElementById("empName")
        .textContent =
        employee.nama || "";


      document.getElementById("empDivision")
        .textContent =
        "Divisi: " +
        (employee.divisi || "-");


      document.getElementById("empStatus")
        .textContent =
        "Status absensi: " +
        (result.status || "-");


      document
        .getElementById("employee")
        .classList.remove("hidden");


      setStatus(
        "Data karyawan ditemukan!"
      );


    } catch (error) {

      setStatus(
        "Gagal mengakses API: " +
        error.message
      );


    } finally {

      btn.disabled = false;

      updateButtons();
    }
  }


  // =====================================================
  // KAMERA
  // =====================================================

  async function startCamera() {

    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung akses kamera."
        );
      }


      stopCamera();


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });


      const cam =
        document.getElementById("cam");


      cam.srcObject = stream;


      document.getElementById("faceStatus")
        .textContent =
        "Kamera aktif. Silakan ambil selfie.";


      document.getElementById("captureBtn")
        .disabled = false;


      updateButtons();


    } catch (error) {

      document.getElementById("faceStatus")
        .textContent =
        "Kamera gagal: " +
        error.name +
        " — " +
        error.message;

    }
  }


  // =====================================================
  // STOP KAMERA
  // =====================================================

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());
    }


    stream = null;


    document.getElementById("cam")
      .srcObject = null;


    document.getElementById("captureBtn")
      .disabled = true;


    updateButtons();
  }


  // =====================================================
  // AMBIL SELFIE
  // =====================================================

  function captureSelfie() {

    if (!stream) {

      setStatus(
        "Aktifkan kamera terlebih dahulu."
      );

      return;
    }


    const video =
      document.getElementById("cam");

    const canvas =
      document.getElementById("photoCanvas");

    const preview =
      document.getElementById("selfiePreview");


    if (
      video.videoWidth === 0 ||
      video.videoHeight === 0
    ) {

      setStatus(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi."
      );

      return;
    }


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    // Membuat hasil foto sama seperti
    // tampilan kamera yang di-mirror.
    ctx.save();

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(-1, 1);


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.restore();


    // Kompres foto menjadi JPEG
    photoData =
      canvas.toDataURL(
        "image/jpeg",
        0.80
      );


    // Tampilkan preview
    preview.src =
      photoData;

    preview.classList.remove(
      "hidden"
    );


    document.getElementById("retakeBtn")
      .classList.remove("hidden");


    document.getElementById("faceStatus")
      .textContent =
      "Selfie berhasil diambil.";


    setStatus(
      "Selfie berhasil. Silakan ambil lokasi GPS."
    );


    updateButtons();
  }


  // =====================================================
  // AMBIL ULANG SELFIE
  // =====================================================

  function retakeSelfie() {

    photoData = null;


    document.getElementById("selfiePreview")
      .classList.add("hidden");


    document.getElementById("retakeBtn")
      .classList.add("hidden");


    document.getElementById("faceStatus")
      .textContent =
      "Silakan ambil selfie lagi.";


    updateButtons();
  }


  // =====================================================
  // GPS
  // =====================================================

  function getGPS() {

    const label =
      document.getElementById("gpsStatus");


    if (!navigator.geolocation) {

      label.textContent =
        "Browser tidak mendukung GPS.";

      return;
    }


    label.textContent =
      "Mengambil lokasi...";


    navigator.geolocation.getCurrentPosition(

      position => {

        locationData = {

          lat:
            position.coords.latitude,

          lng:
            position.coords.longitude

        };


        label.textContent =
          "GPS berhasil: " +
          locationData.lat.toFixed(6) +
          ", " +
          locationData.lng.toFixed(6);


        updateButtons();
      },


      error => {

        label.textContent =
          "GPS gagal: " +
          error.message;


        locationData = null;


        updateButtons();
      },


      {
        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0
      }

    );
  }


  // =====================================================
  // AKTIFKAN / NONAKTIFKAN TOMBOL ABSEN
  // =====================================================

  function updateButtons() {

    const ready =
      !!employee &&
      !!stream &&
      !!photoData &&
      !!locationData;


    document.getElementById("inBtn")
      .disabled = !ready;


    document.getElementById("outBtn")
      .disabled = !ready;
  }


  // =====================================================
  // KIRIM ABSENSI
  // =====================================================

  async function submitAttendance(type) {

    if (
      !employee ||
      !stream ||
      !photoData ||
      !locationData
    ) {

      setStatus(
        "Lengkapi NIK, kamera, selfie, dan GPS terlebih dahulu."
      );

      return;
    }


    const inBtn =
      document.getElementById("inBtn");

    const outBtn =
      document.getElementById("outBtn");


    inBtn.disabled = true;
    outBtn.disabled = true;


    setStatus(
      "Mengirim absensi..."
    );


    // Backend submitAttendance()
    // menggunakan:
    // belum_masuk = absen masuk
    // selain itu = absen pulang

    const backendType =
      type === "masuk"
        ? "belum_masuk"
        : "sudah_masuk";


    const data = {

      action: "submit",

      id: employee.id,

      type: backendType,

      foto: photoData,

      lat: locationData.lat,

      lng: locationData.lng
    };


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)
        });


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );
      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.message ||
          "Absensi gagal disimpan."
        );
      }


      setStatus(
        type === "masuk"
          ? "✅ Absen masuk berhasil disimpan!"
          : "✅ Absen pulang berhasil disimpan!"
      );


      document.getElementById("empStatus")
        .textContent =
        type === "masuk"
          ? "Status absensi: Sudah Masuk"
          : "Status absensi: Sudah Pulang";


      // Setelah berhasil, selfie dikosongkan
      // agar tidak terkirim ulang.
      photoData = null;


      document.getElementById("selfiePreview")
        .classList.add("hidden");


      document.getElementById("retakeBtn")
        .classList.add("hidden");


      updateButtons();


    } catch (error) {

      setStatus(
        "❌ Absensi gagal: " +
        error.message
      );


      updateButtons();
    }
  }

</script>

</body>
</html>
